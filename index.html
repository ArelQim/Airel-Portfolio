</head>

<div class="grid-bg"></div>

<div class="layout">

  <nav class="rail">
    <div>
      <a class="brand" href="#top">
        <div class="brand-mark" id="nav-initials"></div>
        <span class="brand-name" id="nav-name"></span>
        <span class="brand-role" id="nav-role"></span>
      </a>

      <div class="rail-nav">
        <a href="#about"><span class="n">01</span> about</a>
        <a href="#projects"><span class="n">02</span> projects</a>
        <a href="#ethics"><span class="n">03</span> ethics-and-safety</a>
        <a href="#contact"><span class="n">04</span> contact</a>
      </div>
    </div>

    <div class="rail-foot">
      <span id="rail-location"></span><br>
      <span id="rail-updated"></span>
    </div>
  </nav>

  <main>

    <section class="hero" id="top">
      <span class="path-label">/home</span>
      <h1 id="hero-heading"></h1>
      <p class="role-line" id="hero-intro"></p>
    </section>

    <section id="about">
      <span class="path-label">/about</span>
      <h2 id="about-heading" style="font-size:1.9rem;margin-bottom:22px;"></h2>
      <div id="about-paragraphs" class="about-text"></div>
    </section>

    <section id="projects">
      <span class="path-label">/projects</span>
      <div class="section-head">
        <h2>Selected work</h2>
      </div>
      <div class="project-list" id="projects-list"></div>
    </section>

    <section id="ethics">
      <span class="path-label">/ethics-and-safety</span>
      <div class="section-head">
        <h2>How this site was built responsibly</h2>
      </div>

      <ul class="ethics-list" id="ethics-list"></ul>
    </section>

    <section id="contact">
      <span class="path-label">/contact</span>
      <div class="section-head">
        <h2>Get in touch</h2>
      </div>
      <div class="contact-wrap">
        <div class="contact-card">
          <h3>Reach me</h3>
          <div class="contact-row"><span class="lab">email</span><span id="contact-email"></span></div>
          <div class="contact-row"><span class="lab">github</span><a id="contact-github" target="_blank" rel="noopener"></a></div>

</div>

<footer>
  <span>© <span id="footer-year"></span> <span id="footer-name"></span></span>
</footer>

<style>
  :root{
    --ink:#182338;
    --ink-soft:#3c4a63;
    --paper:#EFEDE3;
    --paper-raise:#F8F6EF;
    --line:#c9c4b3;
    --brass:#B9822F;
    --brass-deep:#8f6420;
    --pine:#38564C;
    --pine-soft:#e6ece9;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:16px;
    line-height:1.6;
  }
  ::selection{background:var(--brass);color:var(--paper-raise);}

  .grid-bg{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:64px 64px;
    opacity:0.18;
  }

  a{color:var(--pine);}

  h1,h2,h3{
    font-family:'Fraunces',serif;
    font-weight:600;
    margin:0;
    color:var(--ink);
    letter-spacing:-0.01em;
  }

  .layout{
    display:grid;
    grid-template-columns:260px 1fr;
    max-width:1100px;
    margin:0 auto;
    position:relative;
    z-index:1;
  }

  nav.rail{
    position:sticky;
    top:0;
    height:100vh;
    padding:40px 28px;
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .brand{display:block;text-decoration:none;}
  .brand-mark{
    width:38px;height:38px;
    border:1.5px solid var(--ink);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1rem;
    margin-bottom:14px;
    color:var(--ink);
  }
  .brand-name{
    font-family:'Fraunces',serif;
    font-size:1.15rem;
    font-weight:600;
    color:var(--ink);
    line-height:1.25;
    display:block;
  }
  .brand-role{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.72rem;
    color:var(--pine);
    margin-top:6px;
    display:block;
  }

  .rail-nav{margin-top:56px;}
  .rail-nav a{
    display:flex;
    align-items:baseline;
    gap:10px;
    text-decoration:none;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:0.82rem;
    padding:9px 0;
    border-bottom:1px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .rail-nav a:hover{color:var(--ink);border-color:var(--line);}
  .rail-nav a .n{color:var(--brass-deep);}

  .rail-foot{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.7rem;
    color:var(--ink-soft);
    line-height:1.7;
  }

  main{padding:0 0 100px 0;}
  section{padding:80px 64px;border-bottom:1px solid var(--line);}
  section:last-child{border-bottom:none;}

  .path-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.76rem;
    color:var(--pine);
    margin-bottom:22px;
    display:block;
  }

  .hero{padding-top:70px;}
  .hero h1{
    font-size:clamp(2.2rem, 4.5vw, 3.2rem);
    max-width:18ch;
    line-height:1.1;
  }
  .hero .role-line{
    margin-top:20px;
    max-width:52ch;
    color:var(--ink-soft);
    font-size:1.05rem;
  }

  .about-text p{max-width:58ch;color:var(--ink-soft);margin:0;}
  .about-text p + p{margin-top:14px;}

  .section-head{margin-bottom:36px;}
  .section-head h2{font-size:1.7rem;}

  .project-list{border-top:1px solid var(--line);}
  .project{
    padding:26px 0;
    border-bottom:1px solid var(--line);
    display:grid;
    grid-template-columns:190px 1fr 170px;
    gap:24px;
    align-items:start;
  }
  .project .p-index{font-family:'IBM Plex Mono',monospace;font-size:0.78rem;color:var(--ink-soft);padding-top:4px;}
  .project .p-index .stack{display:block;color:var(--brass-deep);margin-top:6px;}
  .project h3{font-size:1.15rem;margin-bottom:8px;}
  .project p{color:var(--ink-soft);font-size:0.92rem;max-width:52ch;}
  .project .p-meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.72rem;
    color:var(--ink-soft);
    text-align:right;
    line-height:1.9;
  }
  .p-meta a{color:var(--pine);text-decoration:none;border-bottom:1px solid var(--pine);}
  .tag{
    display:inline-block;
    padding:2px 8px;
    border:1px solid var(--line);
    border-radius:20px;
    font-size:0.68rem;
    color:var(--ink-soft);
    margin-right:4px;
  }

  .ethics-list{margin:0;padding:0;list-style:none;max-width:60ch;}
  .ethics-list li{
    padding:14px 0;
    border-top:1px solid var(--line);
    color:var(--ink-soft);
    font-size:0.92rem;
  }
  .ethics-list li:last-child{border-bottom:1px solid var(--line);}

  .contact-wrap{display:grid;grid-template-columns:1fr 1fr;gap:32px;}
  .contact-card{padding:24px;background:var(--paper-raise);border:1px solid var(--line);}
  .contact-card h3{font-size:1rem;margin-bottom:12px;}
  .contact-row{
    display:flex;justify-content:space-between;
    padding:8px 0;
    font-size:0.88rem;
  }
  .contact-row .lab{color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:0.76rem;}

  footer{
    padding:32px 64px;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.72rem;
    color:var(--ink-soft);
  }

  @media (max-width: 900px){
    .layout{grid-template-columns:1fr;}
    nav.rail{position:relative;height:auto;flex-direction:row;align-items:center;justify-content:space-between;padding:20px 24px;}
    .rail-nav{display:none;}
    section{padding:48px 24px;}
    .contact-wrap{grid-template-columns:1fr;}
    .project{grid-template-columns:1fr;}
    .project .p-meta{text-align:left;}
    footer{padding:24px 24px;}
  }

  @media (prefers-reduced-motion: reduce){html{scroll-behavior:auto;}}
</style>

<script>
  function esc(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function render(){
    document.getElementById('nav-initials').textContent = SITE.initials;
    document.getElementById('nav-name').textContent = SITE.name;
    document.getElementById('nav-role').textContent = SITE.course;
    document.getElementById('rail-location').textContent = SITE.location;
    document.getElementById('rail-updated').textContent = 'Updated ' + SITE.updated;
    document.title = SITE.name + ' — IT Portfolio';

    document.getElementById('hero-heading').textContent = SITE.heroHeadline;
    document.getElementById('hero-intro').textContent = SITE.heroIntro;

    document.getElementById('about-heading').textContent = SITE.aboutHeading;
    document.getElementById('about-paragraphs').innerHTML = SITE.aboutParagraphs.map(p => `<p>${esc(p)}</p>`).join('');

    document.getElementById('projects-list').innerHTML = SITE.projects.map((p,i) => `
      <div class="project">
        <div class="p-index">${String(i+1).padStart(2,'0')}<span class="stack">${esc(p.stack)}</span></div>
        <div>
          <h3>${esc(p.title)}</h3>
          <p>${esc(p.desc)}</p>
          ${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}
        </div>
        <div class="p-meta">
          Role: ${esc(p.role)}<br>
          ${esc(p.note)}<br>
          <a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.linkText)}</a>
        </div>
      </div>`).join('');

    document.getElementById('ethics-intro').textContent = SITE.ethicsIntro;
    document.getElementById('ethics-list').innerHTML = SITE.ethics.map(e => `<li>${esc(e)}</li>`).join('');

    document.getElementById('contact-email').textContent = SITE.contact.email;
    document.getElementById('contact-github').textContent = SITE.contact.github;
    document.getElementById('contact-github').href = 'https://' + SITE.contact.github;
    document.getElementById('contact-linkedin').textContent = SITE.contact.linkedin;
    document.getElementById('contact-linkedin').href = 'https://' + SITE.contact.linkedin;
    document.getElementById('funfact-label').textContent = SITE.contact.funFactLabel;
    document.getElementById('contact-funfact').textContent = SITE.contact.funFact;

    document.getElementById('footer-year').textContent = SITE.footerYear;
    document.getElementById('footer-name').textContent = SITE.name;
  }

  render();
</script>

</body>
</html>
